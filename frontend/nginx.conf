# --- Cloudflare real IP --------------------------------------------------
# CF terminates TLS and proxies to us; without this, $remote_addr is a CF edge
# IP and rate-limit / audit logs lose the actual client. CF sends the original
# client in CF-Connecting-IP. Ranges from https://www.cloudflare.com/ips/ —
# refresh with deploy/cf-firewall.sh which writes the same list to UFW.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# HTTP :80 — accepted only as a fallback. With CF set to "Full (strict)" all
# real traffic arrives on :443. We keep :80 listening so that local healthchecks
# (curl http://localhost/healthz) continue to work without TLS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64m;
  client_body_buffer_size 1m;
  client_body_timeout 120s;

  include /etc/nginx/maplelink-locations.inc;
}

# HTTPS :443 — what Cloudflare connects to in Full / Full (strict) mode.
# Certs come from a host volume mounted at /etc/nginx/certs (see compose).
# Use a Cloudflare Origin Certificate (free, 15-year) for "Full (strict)".
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Anthropic caps request bodies at 32 MB and each inline image at 5 MB
  # (base64 blows that up ~33%), so a single 5 MB JPEG arrives as ~6.7 MB
  # of JSON. Default nginx client_max_body_size is 1 MB, which silently 413s
  # any vision request. Lift to 64 MB so /v1/messages with multiple images
  # and /v1/files multipart uploads both go through.
  client_max_body_size 64m;
  client_body_buffer_size 1m;
  client_body_timeout 120s;

  include /etc/nginx/maplelink-locations.inc;
}
