# Claude relay — production-ish single-host deployment.
# Runs: postgres, redis, backend (Node), frontend (nginx serving built SPA + /api proxy).
# Intended for a single VM or local prod-like testing. For real production, split DB/Redis to managed services.
#
# Usage (from this directory):
#   cp .env.example .env   # fill secrets
#   docker compose up -d --build
#   curl http://localhost/healthz
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-maplelink}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: maplelink-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["node", "-e", "import('./dist/db/migrate.js')"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-maplelink}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      UPSTREAM_KEY_KMS: ${UPSTREAM_KEY_KMS}
      ANTHROPIC_UPSTREAM_BASE_URL: ${ANTHROPIC_UPSTREAM_BASE_URL:-https://api.anthropic.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: maplelink-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Needed on Linux so host.docker.internal resolves to the host gateway.
    # macOS/Windows Docker Desktop already provides this name; keeping it here
    # is a no-op on those platforms and a must-have on Linux servers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-maplelink}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      UPSTREAM_KEY_KMS: ${UPSTREAM_KEY_KMS}
      ANTHROPIC_UPSTREAM_BASE_URL: ${ANTHROPIC_UPSTREAM_BASE_URL:-https://api.anthropic.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN}
      DISABLE_USER_QUOTA: true
      CONTACT_EMAIL_GENERAL: ${CONTACT_EMAIL_GENERAL:-}
      CONTACT_EMAIL_SUPPORT: ${CONTACT_EMAIL_SUPPORT:-}
      CONTACT_EMAIL_PRIVACY: ${CONTACT_EMAIL_PRIVACY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: maplelink-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # 443 is what Cloudflare connects to in Full / Full (strict) mode.
    # 80 is kept for local healthcheck (curl http://localhost/healthz) and as
    # a fallback if you temporarily disable the CF proxy.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Cloudflare Origin Certificate (or self-signed fallback). Must contain:
      #   origin.pem  — fullchain
      #   origin.key  — private key
      # bootstrap_remote() in deploy.sh generates a self-signed cert here on
      # first run so nginx can start; replace with a real CF Origin Cert.
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
